
name: SuperKart MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "models/**"
      - "reports/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dataset availability
        run: |
          test -f data/superkart.csv

      - name: Prepare data
        run: python prepare_data.py

      - name: Train and evaluate models
        run: python train_model.py

      - name: Verify output artifacts
        run: |
          test -f models/superkart_best_model.joblib
          test -f models/feature_schema.json
          test -f reports/metrics.json

      - name: Commit updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add models/ reports/ 

          if ! git diff --cached --quiet; then
            git commit -m "Update SuperKart model artifacts [skip ci]"
            git push origin HEAD:main
          else
            echo "No artifact changes to commit."
          fi
